name: Deploy Zola to GitHub Pages (Nix)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      # Fast, reliable Nix on GitHub runners
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v14

      # Optional but highly recommended: automatic binary cache setup
      - name: Enable Nix cache
        uses: DeterminateSystems/magic-nix-cache-action@v7

      - name: Configure Pages
        uses: actions/configure-pages@v5

      # Build your site using Zola from nixpkgs
      # If your site lives in a subfolder, add: working-directory: ./site
      - name: Build with Zola (nixpkgs)
        run: |
          nix --version
          nix run nixpkgs#zola -- build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
