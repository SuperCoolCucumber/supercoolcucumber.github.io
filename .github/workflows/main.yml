name: Deploy Zola to GitHub Pages

on:
  push:
    branches: [ "main", "master" ]   # covers common defaults
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Print ref for debugging
        run: |
          echo "GITHUB_REF=$GITHUB_REF"
          echo "GITHUB_REF_NAME=$GITHUB_REF_NAME"

      - name: Configure Pages
        uses: actions/configure-pages@v5

      # If your Zola site is in a subfolder, add:
      # working-directory: ./site
      - name: Build with Zola
        uses: docker://ghcr.io/getzola/zola:latest
        with:
          args: build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public   # change if you use --output-dir

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
