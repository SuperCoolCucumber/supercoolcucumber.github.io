name: Deploy Zola to GitHub Pages (Nix, no flakes)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Install Nix (official)
        run: |
          sh <(curl -L https://nixos.org/nix/install) --daemon
          . /nix/var/nix/profiles/default/etc/profile.d/nix-daemon.sh
          nix --version

      # Use an official nixpkgs channel (no flakes)
      - name: Configure nixpkgs channel
        run: |
          nix-channel --add https://nixos.org/channels/nixos-24.05 nixpkgs
          nix-channel --update
          nix-instantiate --eval -E '(import <nixpkgs> {}).lib.version'

      - name: Configure Pages
        uses: actions/configure-pages@v5

      # Build the site with Zola from nixpkgs
      # If your site is in a subfolder, add: working-directory: ./site
      - name: Build with Zola (nixpkgs channel)
        run: |
          . /nix/var/nix/profiles/default/etc/profile.d/nix-daemon.sh
          nix-shell -p zola --run "zola build"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
