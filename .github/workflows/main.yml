name: Deploy Zola to GitHub Pages (Nix via Determinate)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

# Required for GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      # Install Nix quickly and correctly on GitHub-hosted runners
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v14

      # Optional but recommended: binary cache for much faster builds
      - name: Enable Nix cache
        uses: DeterminateSystems/magic-nix-cache-action@v7

      - name: Configure Pages
        uses: actions/configure-pages@v5

      # Build the site with Zola from nixpkgs (no repo flakes needed)
      # If your site is in a subfolder, add: working-directory: ./site
      - name: Build with Zola (nixpkgs)
        run: nix run nixpkgs#zola -- build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public   # change if you use --output-dir

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
