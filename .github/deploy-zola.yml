name: Deploy Zola to GitHub Pages

on:
  push:
    branches: [ "main" ]     # change if your default branch is different
  workflow_dispatch:

# Required for GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      # Configures the Pages environment (artifact retention, etc.)
      - name: Configure Pages
        uses: actions/configure-pages@v5

      # Build the site with Zola inside the official container
      - name: Build with Zola
        uses: docker://ghcr.io/getzola/zola:latest
        with:
          args: build

      # Upload the generated static site (Zola outputs to "public/")
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    # "github-pages" env will show the deployed URL in the job summary
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
