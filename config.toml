# The URL the site will be built for
base_url = "https://zola-daisy.winterstein.biz"

theme = "daisy"

title = "Daria Cool!"
description = "Example / demo page for the Daisy theme for Zola."

compile_sass = false
minify_html = true
build_search_index = false

default_language = "en"

# Whether to generate RSS feeds for the website pages
generate_feeds = true

[markdown]
highlight_code = true
highlight_theme = "css"

[extra]
# Put all your custom variables here
enable_theme_switching = true
daisyui_theme_light = "valentine"
daisyui_theme_dark = "valentine"

[extra.footer]
links = [
    { url = "about", i18n_key = "about" },
    { url = "sitemap.xml", i18n_key = "sitemap", no_translation = true },
]

notice = '<a href="https://www.winterstein.biz">Adrian Winterstein</a><br>Powered by <a href="https://getzola.org">Zola</a>, <a href="https://tailwindcss.com">TailwindCSS</a> & <a href="https://daisyui.com">DaisyUI</a>'

[extra.navbar]
links = [
    { url = "about", i18n_key = "about" },
]

[extra.social]
codeberg = "https://codeberg.org/winterstein/zola-theme-daisy"
github = "https://github.com/awinterstein/zola-theme-daisy"
gitlab = ""
stackoverflow = ""
mastodon = ""
linkedin = ""
